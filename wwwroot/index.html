<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Chatbot</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 16px; color: #1f2328; }
  h1 { font-size: 1.5rem; }
  section { border: 1px solid #d0d7de; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  input[type=text] { width: 100%; padding: 10px; box-sizing: border-box; font-size: 1rem; }
  button { margin-top: 10px; padding: 8px 16px; font-size: 1rem; cursor: pointer; }
  #answer { white-space: pre-wrap; line-height: 1.5; min-height: 2em; }
  .muted { color: #656d76; font-size: .9rem; }
</style>
</head>
<body>
<h1>📄 PDF Chatbot <span class="muted">(100% local · .NET + Ollama + pgvector)</span></h1>

<section>
  <strong>1. Upload a PDF</strong><br><br>
  <input type="file" id="file" accept="application/pdf">
  <button onclick="upload()">Upload</button>
  <div id="uploadStatus" class="muted"></div>
</section>

<section>
  <strong>2. Ask a question</strong><br><br>
  <input type="text" id="question" placeholder="What is the hotel allowance per night?"
         onkeydown="if (event.key === 'Enter') ask()">
  <button onclick="ask()">Ask</button>
  <p id="answer"></p>
</section>

<script>
async function upload() {
  const f = document.getElementById('file').files[0];
  const status = document.getElementById('uploadStatus');
  if (!f) return;
  status.textContent = 'Reading and embedding… (first upload can take a minute)';
  const form = new FormData();
  form.append('file', f);
  const res = await fetch('/api/documents', { method: 'POST', body: form });
  const data = await res.json().catch(() => null);
  status.textContent = res.ok
    ? `✅ ${data.file}: ${data.pages} pages, ${data.chunks} chunks stored`
    : '❌ Upload failed';
}

let source;
function ask() {
  const q = document.getElementById('question').value.trim();
  const out = document.getElementById('answer');
  if (!q) return;
  if (source) source.close();
  out.textContent = '';
  source = new EventSource('/api/ask?question=' + encodeURIComponent(q));
  source.onmessage = e => out.textContent += JSON.parse(e.data).text; // {"text":"..."} word by word
  source.onerror = () => source.close(); // server closed the stream = answer finished
}
</script>
</body>
</html>
