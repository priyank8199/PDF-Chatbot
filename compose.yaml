services:
  pgvector:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: pdfchat
      POSTGRES_USER: pdfchat
      POSTGRES_PASSWORD: pdfchat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:
